server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Runtime-generated config. Never cache it because values can change between deployments.
  # Security headers are generated at container start (see docker-entrypoint.sh). They are
  # included in every location, because nginx drops server-level headers in locations with add_header.
  location = /env.js {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Long cache for Vite hashed assets.
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|ttf|otf|woff|woff2)$ {
    access_log off;
    expires 1y;
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app fallback.
  location / {
    include /etc/nginx/security-headers.inc;
    try_files $uri $uri/ /index.html;
  }
}
