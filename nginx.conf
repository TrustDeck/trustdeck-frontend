server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # env.js should not be cached, so runtime changes take effect immediately
  location = /env.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Long cache for hashed assets
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|ttf|otf|woff|woff2)$ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback: serve index.html for unknown routes
  location / {
    try_files $uri $uri/ /index.html;
  }
}
