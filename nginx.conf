server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Runtime-generated config. Never cache it because values can change between deployments.
  location = /env.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Long cache for Vite hashed assets.
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|ttf|otf|woff|woff2)$ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
